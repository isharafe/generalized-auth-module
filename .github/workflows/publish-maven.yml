name: Publish Maven Module

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module to publish"
        required: true
        type: choice
        options:
          - authorization-parent
          - authorization-core
          - authorization-keycloak
          - authorization-ldap
          - authorization-admin

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # Java + Maven Central + GPG configuration
      # ------------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

          # Maven Central credentials
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN

          # GPG signing
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      # ------------------------------------------------------------
      # Build dependencies locally for child modules.
      #
      # Example:
      # authorization-keycloak may depend on authorization-core.
      #
      # -am builds required reactor modules.
      # gpg.skip prevents unnecessary signing during local install.
      # ------------------------------------------------------------
      - name: Build module dependencies
        if: ${{ inputs.module != 'authorization-parent' }}
        run: |
          ./mvnw \
            --batch-mode \
            --projects "${{ inputs.module }}" \
            --also-make \
            clean install \
            -DskipTests \
            -Dgpg.skip=true

      # ------------------------------------------------------------
      # Publish parent POM only.
      #
      # -N / --non-recursive is important because otherwise Maven
      # would also process all child modules.
      # ------------------------------------------------------------
      - name: Publish parent
        if: ${{ inputs.module == 'authorization-parent' }}
        run: |
          ./mvnw \
            --batch-mode \
            --non-recursive \
            clean deploy \
            -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # ------------------------------------------------------------
      # Publish only selected child module.
      #
      # IMPORTANT:
      # Do NOT use --also-make here.
      # Otherwise dependency modules could also be deployed.
      # ------------------------------------------------------------
      - name: Publish selected module
        if: ${{ inputs.module != 'authorization-parent' }}
        run: |
          ./mvnw \
            --batch-mode \
            --projects "${{ inputs.module }}" \
            deploy \
            -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
