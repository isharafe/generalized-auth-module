name: keycloak-employee-demo

services:
  postgres:
    image: postgres:17-alpine
    container_name: keycloak-demo-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  ldap:
    image: osixia/openldap:1.5.0
    container_name: keycloak-demo-ldap
    command: --copy-service
    environment:
      LDAP_ORGANISATION: "Demo Company"
      LDAP_DOMAIN: "demo.local"
      LDAP_BASE_DN: "dc=demo,dc=local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_TLS: "false"
    ports:
      - "1389:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-demo.ldif:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak-demo
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # Demo only. Change these for anything beyond local testing.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
      - "9001:9000"
    volumes:
      - ./keycloak/employee-demo-realm.json:/opt/keycloak/data/import/employee-demo-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_started

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak-demo-init
    entrypoint: ["/bin/bash", "/config/sync-ldap.sh"]
    environment:
      KEYCLOAK_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "employee-demo"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      AUTHORIZATION_SYNC_CLIENT_SECRET: "authorization-sync-service-demo-secret"
    volumes:
      - ./keycloak/sync-ldap.sh:/config/sync-ldap.sh:ro
    depends_on:
      keycloak:
        condition: service_started
      ldap:
        condition: service_started
    restart: "no"

  authorization-demo:
    profiles: ["authorization-demo"]
    image: authorization-demo:local
    container_name: authorization-demo
    build:
      context: ../..
      dockerfile: examples/authorization-demo/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: keycloak-demo
      AUTHORIZATION_KEYCLOAK_BASE_URL: http://keycloak:8080
      AUTHORIZATION_KEYCLOAK_REALM: employee-demo
      AUTHORIZATION_KEYCLOAK_ISSUER_URI: http://host.docker.internal:8081/realms/employee-demo
      AUTHORIZATION_KEYCLOAK_CLIENT_ID: authorization-sync-service
      AUTHORIZATION_KEYCLOAK_CLIENT_SECRET: authorization-sync-service-demo-secret
      AUTHORIZATION_KEYCLOAK_LOGIN_CLIENT_ID: employee-demo
      AUTHORIZATION_KEYCLOAK_LOGIN_CLIENT_SECRET: employee-demo-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    restart: unless-stopped

  authorization-nuxt-backend:
    profiles: ["authorization-nuxt-demo"]
    image: authorization-nuxt-demo-backend:local
    container_name: authorization-nuxt-demo-backend
    build:
      context: ../..
      dockerfile: examples/authorization-nuxt-demo/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: keycloak-demo
      AUTHORIZATION_KEYCLOAK_BASE_URL: http://keycloak:8080
      AUTHORIZATION_KEYCLOAK_REALM: employee-demo
      AUTHORIZATION_KEYCLOAK_ISSUER_URI: http://host.docker.internal:8081/realms/employee-demo
      AUTHORIZATION_KEYCLOAK_CLIENT_ID: authorization-sync-service
      AUTHORIZATION_KEYCLOAK_CLIENT_SECRET: authorization-sync-service-demo-secret
      AUTHORIZATION_KEYCLOAK_LOGIN_CLIENT_ID: employee-demo
      AUTHORIZATION_KEYCLOAK_LOGIN_CLIENT_SECRET: employee-demo-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    restart: unless-stopped

  authorization-nuxt-frontend:
    profiles: ["authorization-nuxt-demo"]
    image: authorization-nuxt-demo-frontend:local
    container_name: authorization-nuxt-demo-frontend
    build:
      context: ../..
      dockerfile: examples/authorization-nuxt-demo/frontend/Dockerfile
    environment:
      NUXT_AUTHORIZATION_NUXT_BACKEND_BASE_URL: http://authorization-nuxt-backend:8082
      NUXT_AUTHORIZATION_NUXT_PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      authorization-nuxt-backend:
        condition: service_started
    restart: unless-stopped

volumes:
  keycloak_postgres_data:
  ldap_data:
  ldap_config:
