authorization:
  seed:
    permissions:
      - code: URL:EMPLOYEE_VIEW
        name: View employees
        type: URL
        pattern: GET:/demo/employees/**
      - code: URL:EMPLOYEE_EDIT
        name: Edit employees
        type: URL
        pattern: PUT:/demo/employees/**
      - code: UI:EMPLOYEE_DIRECTORY
        name: Open the employee directory
        type: UI
        pattern: employeeDirectory
      - code: UI:MANAGER_WORKSPACE
        name: Open the manager workspace
        type: UI
        pattern: managerWorkspace
      - code: UI:EMPLOYEE_EDIT
        name: Use employee edit controls
        type: UI
        pattern: employeeEdit
      - code: UI:AUTHORIZATION_ADMIN
        name: Open authorization administration
        type: UI
        pattern: authorizationAdmin
    permission-groups:
      - code: EMPLOYEE_READ_ACCESS
        name: Employee read access
        permissions: [URL:EMPLOYEE_VIEW, UI:EMPLOYEE_DIRECTORY]
      - code: EMPLOYEE_MANAGEMENT_ACCESS
        name: Employee management access
        permissions: [URL:EMPLOYEE_EDIT, UI:MANAGER_WORKSPACE, UI:EMPLOYEE_EDIT]
      - code: AUTHORIZATION_ADMIN_UI_ACCESS
        name: Authorization administration navigation access
        permissions: [UI:AUTHORIZATION_ADMIN]
    roles:
      - code: HR_ANALYST
        name: HR analyst
        permission-groups: [EMPLOYEE_READ_ACCESS]
      - code: HR_MANAGER
        name: HR manager
        permission-groups: [EMPLOYEE_READ_ACCESS, EMPLOYEE_MANAGEMENT_ACCESS]
      - code: AUTHORIZATION_ADMINISTRATOR
        name: Authorization administrator
        permission-groups: [AUTHZ_SYSTEM_ADMIN, AUTHORIZATION_ADMIN_UI_ACCESS]
    resource-rules:
      - code: DEMO_PUBLIC
        type: URL
        pattern: "*:/demo/public"
        access-mode: PERMIT_ALL
      - code: DEMO_PROFILE
        type: URL
        pattern: "*:/demo/profile"
        access-mode: AUTHENTICATED
      - code: DEMO_EMPLOYEES
        type: URL
        pattern: "*:/demo/employees/**"
        access-mode: AUTHORIZED
      - code: DEMO_EMPLOYEE_DIRECTORY
        type: UI
        pattern: employeeDirectory
        access-mode: AUTHORIZED
      - code: DEMO_MANAGER_WORKSPACE
        type: UI
        pattern: managerWorkspace
        access-mode: AUTHORIZED
      - code: DEMO_EMPLOYEE_EDIT
        type: UI
        pattern: employeeEdit
        access-mode: AUTHORIZED
      - code: DEMO_AUTHORIZATION_ADMIN
        type: UI
        pattern: authorizationAdmin
        access-mode: AUTHORIZED
    external-authority-mappings:
      - source-system: KEYCLOAK
        authority-type: GROUP
        authority: /authorization-demo/hr-analysts
        target:
          type: ROLE
          code: HR_ANALYST
      - source-system: KEYCLOAK
        authority-type: ROLE
        authority: people-manager
        target:
          type: ROLE
          code: HR_MANAGER
      - source-system: KEYCLOAK
        authority-type: GROUP
        authority: /authorization-demo/authorization-administrators
        target:
          type: ROLE
          code: AUTHORIZATION_ADMINISTRATOR
