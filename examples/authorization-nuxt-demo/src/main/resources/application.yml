server:
  port: 8082
  forward-headers-strategy: framework

spring:
  profiles:
    active: keycloak-demo
  datasource:
    url: jdbc:h2:mem:authorization-nuxt-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

authorization:
  enabled: true
  source: database
  admin:
    api:
      enabled: true
      base-path: /authorization-admin/api
    ui:
      enabled: true
      base-path: /authorization-admin
  seed:
    locations:
      - classpath:authorization/nuxt-demo-seed.yml
