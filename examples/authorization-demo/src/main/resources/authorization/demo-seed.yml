authorization:
  seed:
    permissions:
      - code: URL:EMPLOYEE_VIEW
        name: View employees
        type: URL
        pattern: GET:/demo/employees/**
      - code: URL:EMPLOYEE_EDIT
        name: Edit employees
        type: URL
        pattern: PUT:/demo/employees/**
      - code: UI:DEMO_SEE_PAGE_1
        name: See demo page 1
        type: UI
        pattern: seePage1
      - code: UI:DEMO_SEE_PAGE_2
        name: See demo page 2
        type: UI
        pattern: seePage2
    permission-groups:
      - code: EMPLOYEE_VIEWER
        name: Employee viewer
        permissions: [URL:EMPLOYEE_VIEW, UI:DEMO_SEE_PAGE_1]
      - code: EMPLOYEE_MANAGER
        name: Employee manager
        permissions: [URL:EMPLOYEE_VIEW, URL:EMPLOYEE_EDIT, UI:DEMO_SEE_PAGE_1, UI:DEMO_SEE_PAGE_2]
    roles:
      - code: HR_VIEWER
        name: HR viewer
        permission-groups: [EMPLOYEE_VIEWER]
      - code: HR_MANAGER
        name: HR manager
        permission-groups: [EMPLOYEE_MANAGER]
    resource-rules:
      - code: DEMO_PUBLIC
        type: URL
        pattern: "*:/demo/public"
        access-mode: PERMIT_ALL
      - code: DEMO_PROFILE
        type: URL
        pattern: "*:/demo/profile"
        access-mode: AUTHENTICATED
      - code: DEMO_EMPLOYEES
        type: URL
        pattern: "*:/demo/employees/**"
        access-mode: AUTHORIZED
      - code: DEMO_UI_SIGNED_OUT
        type: URL
        pattern: "*:/demo-ui/signed-out"
        access-mode: PERMIT_ALL
      - code: DEMO_UI
        type: URL
        pattern: "*:/demo-ui/**"
        access-mode: AUTHENTICATED
      - code: DEMO_UI_PAGE_1
        type: UI
        pattern: seePage1
        access-mode: AUTHORIZED
      - code: DEMO_UI_PAGE_2
        type: UI
        pattern: seePage2
        access-mode: AUTHORIZED
      - code: AUTHZ_ADMIN_API
        type: URL
        pattern: "*:/authorization-admin/api/**"
        access-mode: AUTHORIZED
      - code: AUTHZ_ADMIN_UI
        type: URL
        pattern: "*:/authorization-admin/**"
        access-mode: AUTHORIZED
    external-authority-mappings:
      - source-system: KEYCLOAK
        authority-type: GROUP
        authority: /authorization-demo/viewers
        target:
          type: ROLE
          code: HR_VIEWER
      - source-system: KEYCLOAK
        authority-type: GROUP
        authority: /authorization-demo/employee-managers
        target:
          type: PERMISSION_GROUP
          code: EMPLOYEE_MANAGER
      - source-system: KEYCLOAK
        authority-type: GROUP
        authority: /authorization-demo/admins
        target:
          type: ROLE
          code: AUTHZ_SYSTEM_ADMIN
      - source-system: KEYCLOAK
        authority-type: ROLE
        authority: authorization-demo-manager
        target:
          type: ROLE
          code: HR_MANAGER
      - source-system: KEYCLOAK
        authority-type: ROLE
        authority: authorization-demo-viewer
        target:
          type: PERMISSION_GROUP
          code: EMPLOYEE_VIEWER
