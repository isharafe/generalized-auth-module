authorization:
  seed:
    permissions:
      - code: EMPLOYEE_VIEW
        name: View employees
        type: URL
        pattern: GET:/demo/employees/**
      - code: EMPLOYEE_EDIT
        name: Edit employees
        type: URL
        pattern: PUT:/demo/employees/**
    permission-groups:
      - code: EMPLOYEE_VIEWER
        name: Employee viewer
        permissions: [EMPLOYEE_VIEW]
      - code: EMPLOYEE_MANAGER
        name: Employee manager
        permissions: [EMPLOYEE_VIEW, EMPLOYEE_EDIT]
    roles:
      - code: HR_VIEWER
        name: HR viewer
        permission-groups: [EMPLOYEE_VIEWER]
      - code: HR_MANAGER
        name: HR manager
        permission-groups: [EMPLOYEE_MANAGER]
    resource-rules:
      - code: DEMO_PUBLIC
        type: URL
        pattern: "*:/demo/public"
        access-mode: PERMIT_ALL
      - code: DEMO_PROFILE
        type: URL
        pattern: "*:/demo/profile"
        access-mode: AUTHENTICATED
      - code: DEMO_EMPLOYEES
        type: URL
        pattern: "*:/demo/employees/**"
        access-mode: AUTHORIZED
      - code: AUTHZ_ADMIN_API
        type: URL
        pattern: "*:/authorization-admin/api/**"
        access-mode: AUTHORIZED
      - code: AUTHZ_ADMIN_UI
        type: URL
        pattern: "*:/authorization-admin/**"
        access-mode: AUTHORIZED
    users:
      - issuer: local
        subject: viewer
        username: viewer
      - issuer: local
        subject: manager
        username: manager
    user-assignments:
      - issuer: local
        subject: viewer
        target-type: ROLE
        target-code: HR_VIEWER
        source: SEED
      - issuer: local
        subject: manager
        target-type: ROLE
        target-code: HR_MANAGER
        source: SEED
      - issuer: local
        subject: manager
        target-type: ROLE
        target-code: AUTHZ_SYSTEM_ADMIN
        source: SEED
