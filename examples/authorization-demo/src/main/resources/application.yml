spring:
  profiles:
    active: demo
  datasource:
    url: jdbc:h2:mem:authorization-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

authorization:
  enabled: true
  source: database
  seed:
    locations:
      - classpath:authorization/demo-seed.yml
